name: Testes

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O projeto não tem dependências: os testes rodam no runner nativo do
      # Node, então não há passo de instalação.
      - name: Rodar os testes
        run: node --test
