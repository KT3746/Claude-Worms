name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar uma que já esteja em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # `enablement` liga o GitHub Pages na primeira execução, então não é
      # preciso mexer nas configurações do repositório na mão.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # O jogo é estático e sem build: publica a raiz do repositório como está.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
